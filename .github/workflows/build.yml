name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle's wrapper jar is compiled for Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships the Android SDK, but sdkmanager is not on PATH.
      - name: Install SDK platform and build tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(find "$SDK" -maxdepth 4 -type f -name sdkmanager | head -1)"
          [ -n "$SDKM" ] || { echo "sdkmanager not found under $SDK" >&2; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          # AGP resolves the platform by the "android-37" hash; the SDK ships it as android-37.0.
          ln -sfn "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # No gradle/actions/setup-gradle: it rejects this project's wrapper JAR checksum, and the
      # build works without its caching.
      # Debug only: the release APK is built and signed on the maintainer's machine with their
      # own key (keystore.properties is not in the repository).
      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: YUTU-debug-apk
          path: app/build/outputs/apk/debug/*.apk
